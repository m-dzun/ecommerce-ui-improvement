name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set frontend API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node -e "require('node:fs').writeFileSync('frontend/js/config.js', 'export const API_BASE = ' + JSON.stringify(process.env.API_BASE_URL || '') + ';\\n')"
      - name: Upload frontend files
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
