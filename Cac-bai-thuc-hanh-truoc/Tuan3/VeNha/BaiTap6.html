    .portfolio {
        background-color: #f8f9fa; 
        padding: 40px 20px;
        text-align: center;
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
    }
    .portfolio h2 {
        font-size: 22px;
        color: #333;
        margin-bottom: 20px;
        position: relative;
        display: inline-block;
    } 
    .portfolio h2::after {
        content: "";
        display: block;
        width: 40px;
        height: 2px;
        background-color: #17a2b8;
        margin: 10px auto 0;
    }
 
    .list-tab {
        list-style: none;
        padding: 0;
        margin: 0 0 40px 0;
        display: flex;
        justify-content: center;
        gap: 25px; 
    }

    .list-tab li a {
        text-decoration: none;
        color: #666;
        font-size: 13px;
        font-weight: bold;
    }

    .list-tab li:first-child a {
        color: #17a2b8; 
    }

    .galerry {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 20px; 
    }

    .galerry li img {
        width: 100%; 
        height: auto;
        display: block;
    }
</style>
