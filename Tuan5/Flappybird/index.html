<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Bird bằng HTML, CSS và jQuery</title>
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <div id="container">
        <div id="bird"></div>
        <div id="pole_1" class="pole"></div>
        <div id="pole_2" class="pole"></div>
        <button id="play_btn" type="button">Click vào để chơi</button>
        <span id="score">0</span>
    </div>
    <button id="restart_btn" type="button">Chơi lại</button>
    <script src="js/jquery.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
